name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  foundation:
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.24"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run mypy
      - uses: actions/cache@v4
        with:
          path: models/face_landmarker.task
          key: face-landmarker-64184e229b263107bc2b804c6625db1341ff2bb731874b0bcc2fe6544e0bc9ff
      - run: uv run python scripts/fetch_face_model.py
      - run: uv run python scripts/export_live_reference.py --check
      - run: uv run pytest --cov=rppg_core --cov=services.api.app --cov=benchmarks --cov-branch --cov-report=json:artifacts/coverage.json
      - run: npm ci
      - run: npm audit --audit-level=moderate
      - run: uv run pip-audit --path .venv/lib/python3.12/site-packages
      - run: uv run python scripts/export_schemas.py
      - run: npm run contracts
      - run: git diff --exit-code -- packages/rppg_types/schemas packages/rppg_types/generated
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure-traces
          path: artifacts/wave8-browser

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: python-coverage
          path: artifacts/coverage.json

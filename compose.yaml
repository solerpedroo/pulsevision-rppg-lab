name: pulsevision
services:
  api:
    image: localhost/pulsevision-api:1.0.0
    healthcheck:
      test:
        [
          CMD,
          /app/.venv/bin/python,
          -c,
          "import os,urllib.request; urllib.request.urlopen(urllib.request.Request('http://127.0.0.1:8000/api/v1/health',headers={'X-API-Key':os.environ['PULSEVISION_API_KEY']}),timeout=3).read()",
        ]
      interval: 10s
      timeout: 5s
      start_period: 20s
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    ports:
      - "127.0.0.1:${PULSEVISION_API_PORT:-8000}:8000"
    environment:
      PULSEVISION_WEB_ORIGINS: http://localhost:${PULSEVISION_WEB_PORT:-3000},http://127.0.0.1:${PULSEVISION_WEB_PORT:-3000}
      PULSEVISION_API_KEY: ${PULSEVISION_API_KEY:?Generate a private key with scripts/init_container_env.py}
    volumes:
      - jobs:/storage
      - type: bind
        source: ./artifacts/container-model/face_landmarker.task
        target: /models/face_landmarker.task
        read_only: true
        bind:
          create_host_path: false
          selinux: z
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=512m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 2g
    cpus: 2
    init: true
    stop_grace_period: 15s
  web:
    image: localhost/pulsevision-web:1.0.0
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:3000/benchmark').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      start_period: 20s
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    ports:
      - "127.0.0.1:${PULSEVISION_WEB_PORT:-3000}:3000"
    volumes:
      - type: bind
        source: ./artifacts/container-model/face_landmarker.task
        target: /app/apps/web/public/mediapipe/face_landmarker.task
        read_only: true
        bind:
          create_host_path: false
          selinux: z
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=64m
      - /app/apps/web/.next/cache:rw,nosuid,nodev,noexec,size=64m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 512m
    cpus: 1
    init: true
    depends_on:
      api:
        condition: service_healthy
volumes:
  jobs:

[project]
name = "pulsevision-rppg-lab"
version = "0.1.0"
description = "Local-first experimental rPPG laboratory"
requires-python = ">=3.12,<3.13"
dependencies = [
    "av==19.0.2",
    "numpy==2.5.4",
    "pydantic>=2.12,<3",
]

[dependency-groups]
dev = ["pytest>=9,<10", "ruff>=0.14,<1", "mypy>=1.18,<2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["packages/rppg_core", "packages/rppg_types"]

[tool.pytest.ini_options]
testpaths = ["tests", "packages/rppg_core/tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["packages/rppg_core", "packages/rppg_types", "scripts"]

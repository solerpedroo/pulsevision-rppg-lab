[project]
name = "pulsevision-rppg-lab"
version = "0.1.0"
description = "Local-first experimental rPPG laboratory"
requires-python = ">=3.12,<3.13"
dependencies = [
    "anyio==4.16.0",
    "av==19.0.2",
    "fastapi==0.162.2",
    "mediapipe==1.2.2",
    "numpy==2.5.4",
    "opencv-contrib-python==5.0.0.93",
    "pydantic>=2.12,<3",
    "scipy==1.18.1",
    "uvicorn==0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9,<10",
    "ruff>=0.14,<1",
    "mypy>=1.18,<2",
    "scipy-stubs>=1.18.1.1",
    "httpx2>=2.16.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["packages/rppg_core", "packages/rppg_types", "benchmarks", "services"]

[tool.pytest.ini_options]
testpaths = ["tests", "packages/rppg_core/tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["packages/rppg_core", "packages/rppg_types", "scripts", "benchmarks", "services"]
